<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">JARVIS Telegram interface</title>
  <desc id="desc">Illustrative Telegram chat showing intent routing, streaming response, source context, and safe input.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="reply" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#334155" stroke-width="1" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <rect x="360" y="45" width="480" height="610" rx="40" fill="#07111f" stroke="#64748b" stroke-width="3" filter="url(#shadow)"/>
  <rect x="360" y="45" width="480" height="74" rx="40" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
  <text x="600" y="83" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">JARVIS</text>
  <text x="600" y="106" text-anchor="middle" fill="#6ee7b7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">online · private session</text>
  <text x="390" y="150" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">JARVIS · personal assistant</text>
  <rect x="390" y="174" width="340" height="58" rx="15" fill="url(#reply)" stroke="#334155" stroke-width="2"/>
  <text x="410" y="201" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Good evening. How can I help?</text>
  <rect x="565" y="255" width="215" height="60" rx="15" fill="url(#bubble)"/>
  <text x="585" y="282" fill="#eff6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Find the latest details</text>
  <text x="585" y="303" fill="#eff6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">about the release.</text>
  <rect x="390" y="345" width="345" height="105" rx="15" fill="url(#reply)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="407" y="365" width="106" height="24" rx="12" fill="#0c4a6e"/>
  <text x="460" y="382" text-anchor="middle" fill="#bae6fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SEARCH</text>
  <text x="410" y="410" fill="#bae6fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Intent detected</text>
  <text x="410" y="434" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Streaming answer with sources</text>
  <text x="410" y="454" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">provider: Groq · fallback ready</text>
  <rect x="390" y="490" width="345" height="48" rx="12" fill="#334155"/>
  <text x="410" y="520" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Message</text>
  <circle cx="704" cy="514" r="5" fill="#94a3b8"/>
  <circle cx="720" cy="514" r="5" fill="#94a3b8"/>
  <circle cx="736" cy="514" r="5" fill="#94a3b8"/>
  <text x="600" y="657" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Illustrative Telegram mockup · no real conversation shown</text>
</svg>
