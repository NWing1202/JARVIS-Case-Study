<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#172033"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#312e81"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700">Long-term memory pipeline</text>
  <text x="600" y="91" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, Arial, sans-serif" font-size="17">Local storage · relevance recall · instruction-safe context</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="210" height="90" rx="16" fill="#172033" stroke="#60a5fa"/>
    <text x="175" y="205" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">Conversation</text>
    <text x="175" y="232" text-anchor="middle" fill="#bfdbfe" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">messages + history</text>
  </g>
  <path d="M280 215 L365 215" stroke="#60a5fa" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="380" y="170" width="210" height="90" rx="16" fill="#172033" stroke="#34d399"/>
    <text x="485" y="205" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">Extract</text>
    <text x="485" y="232" text-anchor="middle" fill="#bbf7d0" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">facts + profile</text>
  </g>
  <path d="M590 215 L675 215" stroke="#34d399" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="690" y="170" width="210" height="90" rx="16" fill="#172033" stroke="#f59e0b"/>
    <text x="795" y="205" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">Filter + dedupe</text>
    <text x="795" y="232" text-anchor="middle" fill="#ffedd5" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">safety + normalization</text>
  </g>
  <path d="M900 215 L985 215" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="1000" y="170" width="130" height="90" rx="16" fill="#172033" stroke="#a78bfa"/>
    <text x="1065" y="205" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700">SQLite</text>
    <text x="1065" y="232" text-anchor="middle" fill="#ede9fe" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">store + FTS</text>
  </g>

  <path d="M1065 260 L1065 325 L585 325 L585 370" stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="390" y="375" width="390" height="100" rx="16" fill="#172033" stroke="#a78bfa"/>
    <text x="585" y="410" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">Recall for current prompt</text>
    <text x="585" y="437" text-anchor="middle" fill="#ede9fe" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">keywords → ranked memories + profile</text>
  </g>
  <path d="M585 475 L585 520" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="390" y="525" width="390" height="80" rx="16" fill="#172033" stroke="#f472b6"/>
    <text x="585" y="560" text-anchor="middle" fill="#f8fafc" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">PromptPipeline</text>
    <text x="585" y="587" text-anchor="middle" fill="#fbcfe8" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">safe context, never trusted instructions</text>
  </g>

  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>
  <text x="600" y="650" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, Arial, sans-serif" font-size="15">Illustrative memory flow — no real memories or user data shown.</text>
</svg>
