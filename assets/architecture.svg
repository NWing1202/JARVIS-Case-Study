    <text x="440" y="682" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">OpenRouter</text>
    <text x="440" y="707" text-anchor="middle" fill="#bbf7d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">secondary routing</text>
    <rect x="590" y="650" width="220" height="76" rx="16" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/>
    <text x="700" y="682" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Zen</text>
    <text x="700" y="707" text-anchor="middle" fill="#ffedd5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">additional candidate</text>
  </g>
