<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">J.A.R.V.I.S. architecture</title>
  <desc id="desc">Logical architecture showing interfaces, JarvisCore, PromptPipeline, EventBus, plugins, provider fallback, AgentLoop, and safety controls.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#152238"/>
      <stop offset="1" stop-color="#0e1728"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#334155" stroke-width="1" opacity="0.22"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L0 6L9 3Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L0 6L9 3Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L0 6L9 3Z" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L0 6L9 3Z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <text x="600" y="57" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">J.A.R.V.I.S. architecture</text>
  <text x="600" y="90" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Logical public contract · no credentials or private data</text>

  <g filter="url(#shadow)">
    <rect x="70" y="135" width="190" height="78" rx="16" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/>
    <text x="165" y="168" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Web UI</text>
    <text x="165" y="193" text-anchor="middle" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">WebSocket + chat</text>
    <rect x="305" y="135" width="190" height="78" rx="16" fill="url(#card)" stroke="#38bdf8" stroke-width="2"/>
    <text x="400" y="168" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Telegram Bot</text>
    <text x="400" y="193" text-anchor="middle" fill="#bae6fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">commands + state</text>
    <rect x="540" y="135" width="170" height="78" rx="16" fill="url(#card)" stroke="#a78bfa" stroke-width="2"/>
    <text x="625" y="168" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Tray</text>
    <text x="625" y="193" text-anchor="middle" fill="#ddd6fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">background tasks</text>
  </g>
  <path d="M165 213L165 245L600 245L600 250" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M400 213L400 245L600 245L600 250" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M625 213L625 245L600 245L600 250" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <g filter="url(#shadow)">
    <rect x="430" y="250" width="340" height="82" rx="18" fill="url(#card)" stroke="#34d399" stroke-width="2"/>
    <text x="600" y="284" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">JarvisCore</text>
    <text x="600" y="311" text-anchor="middle" fill="#bbf7d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">dialogue orchestration</text>
  </g>
  <path d="M600 332L600 370" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="430" y="370" width="340" height="72" rx="16" fill="url(#card)" stroke="#a78bfa" stroke-width="2"/>
    <text x="600" y="401" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">PromptPipeline</text>
    <text x="600" y="427" text-anchor="middle" fill="#ddd6fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">system + plugins + history</text>
  </g>
  <path d="M600 442L600 485" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-violet)"/>

  <g filter="url(#shadow)">
    <rect x="430" y="485" width="340" height="72" rx="16" fill="url(#card)" stroke="#f472b6" stroke-width="2"/>
    <text x="600" y="516" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Provider Manager</text>
    <text x="600" y="542" text-anchor="middle" fill="#fbcfe8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">candidate order · fallback · health</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="250" width="250" height="65" rx="16" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/>
    <text x="975" y="281" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">EventBus</text>
    <text x="975" y="307" text-anchor="middle" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">sync + async events</text>
  </g>
  <path d="M770 291H850" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>

