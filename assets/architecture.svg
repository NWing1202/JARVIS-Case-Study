  <path d="M600 557V650" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M680 557C680 600 700 600 700 650" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-violet)"/>

  <g filter="url(#shadow)">
    <rect x="850" y="650" width="250" height="76" rx="16" fill="url(#card)" stroke="#f472b6" stroke-width="2"/>
    <text x="975" y="682" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Local / Bridge</text>
    <text x="975" y="707" text-anchor="middle" fill="#fbcfe8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Ollama · GGUF · HTTP</text>
    <rect x="280" y="770" width="220" height="64" rx="15" fill="url(#card)" stroke="#fbbf24" stroke-width="2"/>
    <text x="390" y="800" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Plugin tools</text>
    <text x="390" y="825" text-anchor="middle" fill="#fde68a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">search · memory · voice</text>
    <rect x="560" y="770" width="220" height="64" rx="15" fill="url(#card)" stroke="#fb7185" stroke-width="2"/>
    <text x="670" y="800" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Security + Autonomy</text>
    <text x="670" y="825" text-anchor="middle" fill="#fecdd3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">deny · confirm · audit</text>
    <rect x="850" y="770" width="250" height="64" rx="15" fill="url(#card)" stroke="#34d399" stroke-width="2"/>
    <text x="975" y="800" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">AgentLoop</text>
    <text x="975" y="825" text-anchor="middle" fill="#bbf7d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">tool loop when supported</text>
  </g>
  <path d="M770 557L850 770" fill="none" stroke="#f472b6" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-violet)"/>
  <path d="M500 802H560" fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M780 802H850" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1100 802C1100 842 390 842 390 802" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="910" y="640" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">tool-capable path</text>

  <path d="M600 332C600 350 900 350 900 459" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="5 7" opacity="0.75"/>
  <path d="M600 332C600 360 900 360 900 539" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="5 7" opacity="0.75"/>
  <text x="760" y="365" fill="#6ee7b7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">background extraction</text>

  <text x="600" y="878" text-anchor="middle" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Solid arrows: request flow · dashed arrows: context, events, or background work</text>
</svg>
