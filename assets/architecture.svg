    <text x="975" y="374" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Search plugin</text>
    <text x="975" y="396" text-anchor="middle" fill="#bae6fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">intent + sources</text>
    <rect x="850" y="430" width="250" height="58" rx="14" fill="#102a3a" stroke="#34d399" stroke-width="2"/>
    <text x="975" y="454" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Memory plugin</text>
    <text x="975" y="476" text-anchor="middle" fill="#bbf7d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">facts + profile</text>
    <rect x="850" y="510" width="250" height="58" rx="14" fill="#241a3d" stroke="#a78bfa" stroke-width="2"/>
    <text x="975" y="534" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Skills plugin</text>
    <text x="975" y="556" text-anchor="middle" fill="#ddd6fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">procedures</text>
    <rect x="850" y="590" width="250" height="58" rx="14" fill="#17332b" stroke="#6ee7b7" stroke-width="2"/>
    <text x="975" y="614" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Voice plugin</text>
    <text x="975" y="636" text-anchor="middle" fill="#a7f3d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">TTS + STT</text>
  </g>
  <path d="M975 315V350H850" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M975 315V430H850" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-green)"/>
  <path d="M975 315V510H850" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow-violet)"/>
  <path d="M975 315V590H850" fill="none" stroke="#6ee7b7" stroke-width="3" marker-end="url(#arrow-green)"/>

  <path d="M850 379C810 379 810 406 770 406" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-blue)"/>
  <path d="M850 459C820 459 820 420 770 420" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-green)"/>
  <path d="M850 539C820 539 820 430 770 430" fill="none" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-violet)"/>
  <path d="M850 619C820 619 820 440 770 440" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow-green)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="650" width="220" height="76" rx="16" fill="url(#card)" stroke="#60a5fa" stroke-width="2"/>
    <text x="180" y="682" text-anchor="middle" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Groq</text>
    <text x="180" y="707" text-anchor="middle" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">fast primary</text>
