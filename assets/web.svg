<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">JARVIS web interface</title>
  <desc id="desc">Illustrative dark web console with workspace sidebar, streaming chat, context panel, and provider status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#152238"/>
      <stop offset="1" stop-color="#0e1728"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#312e81"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#334155" stroke-width="1" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <rect x="70" y="55" width="1060" height="570" rx="22" fill="#07111f" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <rect x="70" y="55" width="1060" height="54" rx="22" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="105" cy="82" r="8" fill="#f87171"/>
  <circle cx="132" cy="82" r="8" fill="#fbbf24"/>
  <circle cx="159" cy="82" r="8" fill="#34d399"/>
  <text x="600" y="89" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">JARVIS · Web console</text>
  <rect x="95" y="135" width="245" height="430" rx="16" fill="url(#panel)" stroke="#475569" stroke-width="2"/>
  <text x="122" y="170" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Workspace</text>
  <text x="122" y="205" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Recent chats</text>
  <rect x="120" y="228" width="195" height="42" rx="10" fill="#334155"/>
  <text x="137" y="254" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Architecture review</text>
  <rect x="120" y="284" width="195" height="42" rx="10" fill="#263653"/>
  <text x="137" y="310" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Memory design</text>
  <text x="122" y="365" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Modules</text>
  <rect x="120" y="390" width="195" height="34" rx="8" fill="#14532d"/>
  <circle cx="136" cy="407" r="5" fill="#34d399"/>
  <text x="151" y="412" fill="#dcfce7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Memory</text>
  <rect x="120" y="434" width="195" height="34" rx="8" fill="#164e63"/>
  <circle cx="136" cy="451" r="5" fill="#38bdf8"/>
  <text x="151" y="456" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Web Search</text>
  <rect x="120" y="478" width="195" height="34" rx="8" fill="#334155"/>
  <circle cx="136" cy="495" r="5" fill="#94a3b8"/>
  <text x="151" y="500" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Voice</text>
  <rect x="370" y="135" width="555" height="430" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <text x="398" y="172" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">New chat</text>
  <rect x="398" y="202" width="475" height="52" rx="11" fill="#1f2937" stroke="#475569" stroke-width="2"/>
  <text x="418" y="233" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Ask JARVIS anything…</text>
  <rect x="398" y="286" width="145" height="46" rx="11" fill="#1e3a8a"/>
  <text x="420" y="314" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">User message</text>
  <rect x="398" y="352" width="475" height="116" rx="11" fill="url(#stream)" stroke="#60a5fa" stroke-width="2"/>
  <circle cx="425" cy="381" r="5" fill="#67e8f9"/>
  <circle cx="425" cy="405" r="5" fill="#818cf8"/>
  <circle cx="425" cy="429" r="5" fill="#c4b5fd"/>
  <text x="445" y="386" fill="#f0f9ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Streaming response</text>
  <text x="445" y="411" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">with provider status</text>
  <text x="445" y="436" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">and context panel</text>
  <rect x="398" y="494" width="475" height="44" rx="11" fill="#334155"/>
  <text x="420" y="522" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Send</text>
  <rect x="950" y="135" width="160" height="430" rx="16" fill="url(#panel)" stroke="#475569" stroke-width="2"/>
  <text x="980" y="170" fill="#bfdbfe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Context</text>
  <rect x="972" y="198" width="116" height="72" rx="10" fill="#14532d"/>
  <text x="1030" y="226" text-anchor="middle" fill="#dcfce7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Memory</text>
  <text x="1030" y="248" text-anchor="middle" fill="#dcfce7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">5 hits</text>
  <rect x="972" y="290" width="116" height="72" rx="10" fill="#164e63"/>
  <text x="1030" y="318" text-anchor="middle" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Search</text>
  <text x="1030" y="340" text-anchor="middle" fill="#e0f2fe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">3 sources</text>
  <rect x="972" y="382" width="116" height="72" rx="10" fill="#3f3f46"/>
  <text x="1030" y="410" text-anchor="middle" fill="#f4f4f5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Provider</text>
  <text x="1030" y="432" text-anchor="middle" fill="#f4f4f5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Groq · OK</text>
  <rect x="972" y="474" width="116" height="42" rx="10" fill="#1e293b"/>
  <text x="1030" y="500" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">session · private</text>
  <text x="600" y="657" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Illustrative interface mockup · no real user data shown</text>
</svg>
